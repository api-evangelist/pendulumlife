aid: pendulumlife
name: Pendulumlife
description: >-
  Pendulum (pendulumlife.com) is a direct-to-consumer probiotics and metabolic-health
  company founded by PhD scientists from Johns Hopkins, Harvard, Berkeley and Stanford.
  It sells next-generation probiotic supplements such as Metabolic Daily, Akkermansia,
  Glucose Control (a medical probiotic clinically shown to improve A1C in type 2 diabetes)
  and Polyphenol Booster. Surfaced as a portfolio company of felicis and added to the API
  Evangelist network for enrichment. Enrichment finding: the site is a Shopify-hosted
  storefront and Pendulum publishes no first-party developer API, SDKs, or documentation;
  the only machine surface is Shopify's platform customer-account OIDC discovery endpoint.
